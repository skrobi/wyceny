# Skopiuj do config.toml i dostosuj. config.toml nie trafia do repozytorium.

[baza]
serwer = "splmcd08"
baza = "WYCENY"
sterownik = "ODBC Driver 18 for SQL Server"
# Driver 18 domyślnie szyfruje połączenie; przy certyfikacie wewnętrznym potrzebne jest zaufanie do certyfikatu serwera.
szyfrowanie = true
ufaj_certyfikatowi = true

[analiza]
# Pierwsze analizowane zapytanie (TenderEnquiryId) – wcześniejsze to głównie testy.
pierwsze_zapytanie_id = 758
# Techniczna dolna granica pobierania workflow, kroków i zdarzeń (obiegi zapytań z zakresu powstały po niej).
data_startu = "2026-04-01"
# Zadania „wyjścia z obiegu” – nie są brane pod uwagę (porównanie po początku opisu zadania).
pomijane_zadania = ["Ewentualne zmiany w RFQ", "Ewentualne zmiany w BOM"]
# Statusy zapytania traktowane jako zamknięte.
statusy_zamkniete = [9, 10, 11, 12, 13]
# Strefa czasowa raportu (czasy w bazie workflow są w UTC).
strefa_czasowa = "Europe/Warsaw"
# Otwarte zadanie starsze niż tyle dni trafia do arkusza „Porzucone”.
prog_porzucenia_dni = 30
# Plik JSON dla asystenta AI: osoby zastępowane pseudonimami („Osoba 07”). Wyłącz tylko do użytku wewnętrznego.
json_anonimizacja = true
# Statusy zapytania oznaczające przekazanie oferty klientowi (ocena terminowości).
statusy_przekazane = [9]
# Ile dni po grupie, na którą się czeka, może skończyć grupa zależna, by opóźnienie przypisać tamtej.
tolerancja_zaleznosci_dni = 1.0
# Słownik konsultant (eID) -> dział. Program tworzy szablon slowniki/konsultanci.csv – uzupełnij kolumnę Dzial.
slownik_konsultantow = "slowniki/konsultanci.csv"

# Grupa -> grupy, na których dane czeka w fazie zbierania danych.
[analiza.zaleznosci_grup]
DJ = ["DTTW"]

[katalogi]
dane = "data"
raporty = "raporty"
